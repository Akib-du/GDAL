name: Build GDAL + NumPy + Rasterio wheels (Android arm64-v8a)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Build GDAL.yml"
      - "gdal-config"
      - "arm64-android-gis.cmake"

env:
  PY_TAG: cp313
  GDAL_TRIPLET: arm64-android-gis
  RASTERIO_VERSION: "1.4.3"
  NUMPY_VERSION: "2.2.6"
  GDAL_SOURCE_RUN_ID: "45036542523"

jobs:
  gdal:
    name: Restore verified GDAL prefix (no rebuild)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gdal-prefix
          run-id: ${{ env.GDAL_SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Validate and republish cached GDAL prefix
        shell: bash
        run: |
          set -euo pipefail
          test -s gdal-prefix.tgz
          tar -tzf gdal-prefix.tgz | grep -q "^$GDAL_TRIPLET/include/gdal.h$"
          tar -tzf gdal-prefix.tgz | grep -q "^$GDAL_TRIPLET/lib/libgdal.so$"
          echo "Verified cached GDAL prefix from run $GDAL_SOURCE_RUN_ID; no GDAL compilation."
      
      - uses: actions/upload-artifact@v4
        with:
          name: gdal-prefix
          path: gdal-prefix.tgz
          if-no-files-found: error
          retention-days: 14

  sources:
    name: Download and preserve NumPy + Rasterio sources
    needs: gdal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: gdal-prefix

      - name: Unpack and validate GDAL configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gdal"
          tar -xzf gdal-prefix.tgz -C "$HOME/gdal"
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          chmod +x "$GITHUB_WORKSPACE/gdal-config"
          export GDAL_CONFIG="$GITHUB_WORKSPACE/gdal-config"
          export PATH="$GITHUB_WORKSPACE:$PATH"
          test -f "$GDAL_PREFIX/include/gdal.h"
          test -f "$GDAL_PREFIX/lib/libgdal.so"
          test -d "$GDAL_PREFIX/share/gdal"
          "$GDAL_CONFIG" --version
          echo "GDAL_PREFIX=$GDAL_PREFIX" >> "$GITHUB_ENV"

      - name: Download NumPy and Rasterio source distributions
        shell: bash
        run: |
          set -euo pipefail
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          export GDAL_CONFIG="$GITHUB_WORKSPACE/gdal-config"
          export GDAL_VERSION="$("$GDAL_CONFIG" --version)"
          export PATH="$GITHUB_WORKSPACE:$PATH"
          mkdir -p sdists
          python -m pip download --no-binary :all: --no-deps -d sdists \
            "numpy==$NUMPY_VERSION" "rasterio==$RASTERIO_VERSION"
          test -s "sdists/numpy-$NUMPY_VERSION.tar.gz"
          test -s "sdists/rasterio-$RASTERIO_VERSION.tar.gz"
          tar -tzf "sdists/numpy-$NUMPY_VERSION.tar.gz" >/dev/null
          tar -tzf "sdists/rasterio-$RASTERIO_VERSION.tar.gz" >/dev/null
          sha256sum sdists/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdists
          path: sdists/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheels:
    name: Build NumPy + Rasterio Android wheels (reuse cached inputs)
    needs: [gdal, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: gdal-prefix

      - uses: actions/download-artifact@v4
        with:
          name: python-sdists

      - name: Unpack and validate cached inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gdal" src
          tar -xzf gdal-prefix.tgz -C "$HOME/gdal"
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          chmod +x "$GITHUB_WORKSPACE/gdal-config"
          test -f "$GDAL_PREFIX/include/gdal.h"
          test -f "$GDAL_PREFIX/lib/libgdal.so"
          test -s "numpy-$NUMPY_VERSION.tar.gz"
          test -s "rasterio-$RASTERIO_VERSION.tar.gz"
          tar -xzf "numpy-$NUMPY_VERSION.tar.gz" -C src
          tar -xzf "rasterio-$RASTERIO_VERSION.tar.gz" -C src
          test -d "src/numpy-$NUMPY_VERSION"
          test -d "src/rasterio-$RASTERIO_VERSION"
          echo "GDAL prefix and both source distributions restored from artifacts."

      - name: Install cibuildwheel
        run: python -m pip install --upgrade "cibuildwheel==3.3.1"

      - name: Build NumPy Android wheel
        shell: bash
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
          CIBW_BEFORE_BUILD: "pip install 'Cython>=3.0.6' 'meson-python>=0.15.0'"
        run: |
          set -euo pipefail
          python -m cibuildwheel --output-dir wheelhouse "src/numpy-$NUMPY_VERSION"

      - name: Build Rasterio Android wheel
        shell: bash
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
        run: |
          set -euo pipefail
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          export CIBW_ENVIRONMENT="GDAL_PREFIX=$GDAL_PREFIX GDAL_CONFIG=$GITHUB_WORKSPACE/gdal-config PKG_CONFIG_PATH=$GDAL_PREFIX/lib/pkgconfig"
          export CIBW_BEFORE_BUILD="pip install cython numpy==$NUMPY_VERSION setuptools wheel"
          python -m cibuildwheel --output-dir wheelhouse "src/rasterio-$RASTERIO_VERSION"

      - name: Collect GDAL runtime libraries and data
        shell: bash
        run: |
          set -euo pipefail
          GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          mkdir -p wheelhouse/native wheelhouse/data
          find "$GDAL_PREFIX/lib" -maxdepth 1 -type f -name '*.so*' -exec cp -av {} wheelhouse/native/ \;
          test -n "$(find wheelhouse/native -type f -name '*.so*' -print -quit)"
          cp -a "$GDAL_PREFIX/share/gdal" wheelhouse/data/gdal
          cp -a "$GDAL_PREFIX/share/proj" wheelhouse/data/proj

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-gis-wheels
          path: wheelhouse
          if-no-files-found: error
          retention-days: 14
