name: Prepare NumPy Android ARM64 wheel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Resume NumPy Rasterio.yml"

jobs:
  prepare-numpy:
    name: Download and validate prebuilt NumPy CPython 3.13 Android ARM64 wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download upstream prebuilt NumPy wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          URL="https://chaquo.com/pypi-upstream/numpy/numpy-2.3.2-1-cp313-cp313-android_24_arm64_v8a.whl"
          FILE="wheelhouse/numpy-2.3.2-1-cp313-cp313-android_24_arm64_v8a.whl"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 900 "$URL" -o "$FILE"
          test -s "$FILE"
          ls -lh "$FILE"
          sha256sum "$FILE" | tee wheelhouse/SHA256SUMS

      - name: Validate wheel metadata, archive and Android ELF binaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile
          import re, subprocess, tempfile

          wheel = Path("wheelhouse/numpy-2.3.2-1-cp313-cp313-android_24_arm64_v8a.whl")
          with ZipFile(wheel) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              metadata_path = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              wheel_path = next(n for n in z.namelist() if n.endswith(".dist-info/WHEEL"))
              metadata = Parser().parsestr(z.read(metadata_path).decode())
              wheel_metadata = z.read(wheel_path).decode()
              print("Package:", metadata["Name"])
              print("Version:", metadata["Version"])
              print("Requires-Dist:", metadata.get_all("Requires-Dist", []))
              print("Wheel tags:", [line for line in wheel_metadata.splitlines() if line.startswith("Tag:")])
              assert metadata["Name"].lower() == "numpy"
              assert metadata["Version"] == "2.3.2"
              assert "cp313-cp313-android_24_arm64_v8a" in wheel_metadata
              so_files = [n for n in z.namelist() if n.endswith(".so")]
              if not so_files:
                  raise SystemExit("No native .so files found in NumPy wheel")
              with tempfile.TemporaryDirectory() as td:
                  for i, name in enumerate(so_files):
                      target = Path(td) / f"{i}.so"
                      target.write_bytes(z.read(name))
                      out = subprocess.check_output(["readelf", "-h", str(target)], text=True)
                      if "AArch64" not in out:
                          raise SystemExit(f"Non-AArch64 native library: {name}")
                      ph = subprocess.check_output(["readelf", "-lW", str(target)], text=True)
                      aligns = [int(x, 16) for x in re.findall(r"LOAD\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(0x[0-9a-fA-F]+)", ph)]
                      if not aligns:
                          raise SystemExit(f"No LOAD alignment found: {name}")
                      if min(aligns) < 0x4000:
                          raise SystemExit(f"16 KB alignment check failed for {name}: {aligns}")
                      print(f"16 KB ELF OK: {name}; min LOAD alignment={hex(min(aligns))}")
          PY

      - name: Upload NumPy wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: numpy-2.3.2-android-arm64-cp313
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    name: Download and verify saved NumPy artifact
    needs: prepare-numpy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: numpy-2.3.2-android-arm64-cp313
          path: downloaded-numpy

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          cd downloaded-numpy
          sha256sum --check SHA256SUMS
          python -m zipfile -t numpy-2.3.2-1-cp313-cp313-android_24_arm64_v8a.whl
          ls -lh
          echo "Saved NumPy artifact was downloaded and verified successfully."
