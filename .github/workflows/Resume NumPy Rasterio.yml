name: Resume NumPy + Rasterio Android wheels (reuse GDAL)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Resume NumPy Rasterio.yml"

env:
  PY_TAG: cp313
  GDAL_TRIPLET: arm64-android-gis
  RASTERIO_VERSION: "1.4.3"
  NUMPY_VERSION: "2.2.6"
  GDAL_SOURCE_RUN_ID: "45036542523"

jobs:
  wheels:
    name: Build NumPy + Rasterio Android wheels (resume after source download)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Reuse the verified artifacts created in Run #22; do not rebuild GDAL
      # and do not download NumPy/Rasterio source distributions again.
      - uses: actions/download-artifact@v4
        with:
          name: gdal-prefix
          run-id: 45042047911
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          name: python-sdists
          run-id: 45042047911
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Restore and validate cached inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gdal" src
          tar -xzf gdal-prefix.tgz -C "$HOME/gdal"
          test -f "$HOME/gdal/$GDAL_TRIPLET/include/gdal.h"
          test -f "$HOME/gdal/$GDAL_TRIPLET/lib/libgdal.so"
          test -s "numpy-$NUMPY_VERSION.tar.gz"
          test -s "rasterio-$RASTERIO_VERSION.tar.gz"
          tar -xzf "numpy-$NUMPY_VERSION.tar.gz" -C src
          tar -xzf "rasterio-$RASTERIO_VERSION.tar.gz" -C src
          test -d "src/numpy-$NUMPY_VERSION"
          test -d "src/rasterio-$RASTERIO_VERSION"
          echo "Restored GDAL prefix and both source archives; no source downloads."

      - name: Patch NumPy Android complex-math feature detection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/numpy-2.2.6/numpy/_core/meson.build")
          source = path.read_text()
          old = """mandatory_complex_math_funcs = [
            'csin', 'csinh', 'ccos', 'ccosh', 'ctan', 'ctanh', 'creal', 'cimag', 'conj'
          ]
          foreach func: mandatory_complex_math_funcs
            if not cc.has_function(func, prefix: '#include <complex.h>', dependencies: m_dep)
              error(f'Function `@func@` not found')
            endif
          endforeach
          """
          if old not in source:
              raise SystemExit("Expected NumPy 2.2.6 mandatory complex-math check not found; refusing unsafe patch")
          source = source.replace(
              old,
              "# Android/Bionic may omit optional C99 complex libm symbols.\n"
              "# Keep NumPy's per-function HAVE_* probes below so its bundled\n"
              "# npymath compatibility implementations are selected.\n"
              "mandatory_complex_math_funcs = []\n",
              1,
          )
          path.write_text(source)
          check = path.read_text()

          # NumPy's C inline complex accessors call creal/cimag variants.
          # Bionic declares these in <complex.h>; npy_math.h only included
          # <math.h>, so add the C-only declaration header explicitly.
          header = Path("src/numpy-2.2.6/numpy/_core/include/numpy/npy_math.h")
          htext = header.read_text()
          include_anchor = "#include <math.h>\\n"
          include_patch = "#include <math.h>\\n\\n#ifndef __cplusplus\\n#include <complex.h>\\n#endif\\n"
          if include_patch not in htext:
              if include_anchor not in htext:
                  raise SystemExit("Expected npy_math.h math.h include not found; refusing unsafe patch")
              htext = htext.replace(include_anchor, include_patch, 1)
              header.write_text(htext)
          verified_header = header.read_text()
          assert "#ifndef __cplusplus\\n#include <complex.h>\\n#endif" in verified_header
          print("Verified: C complex accessors receive Bionic declarations from <complex.h>.")
          assert "mandatory_complex_math_funcs = []" in check
          assert "c99_complex_funcs = [" in check

          # Android arm64 follows the AArch64 ABI: 16-byte IEEE binary128
          # long double, little-endian. Verify the ABI properties with
          # compile-only checks; never try to execute a target binary.
          anchor = "longdouble_format = meson.get_external_property('longdouble_format', 'UNKNOWN')\n"
          if anchor not in check:
              raise SystemExit("Expected NumPy long-double detection anchor not found; refusing unsafe patch")
          abi_patch = """longdouble_format = meson.get_external_property('longdouble_format', 'UNKNOWN')
          if longdouble_format == 'UNKNOWN' and host_machine.system() == 'android' and host_machine.cpu_family() == 'aarch64'
            if host_machine.endian() == 'little' and cc.sizeof('long double') == 16 and cc.compiles('#include <float.h>\n_Static_assert(LDBL_MANT_DIG == 113, "not IEEE binary128");\nint main(void) { return 0; }')
              longdouble_format = 'IEEE_QUAD_LE'
            endif
          endif
          """
          check = check.replace(anchor, abi_patch, 1)
          path.write_text(check)
          verified = path.read_text()
          assert "longdouble_format = 'IEEE_QUAD_LE'" in verified
          assert "LDBL_MANT_DIG == 113" in verified
          print("Verified: Android arm64 long-double format uses compile-time ABI checks; no target execution.")
          PY

      - name: Install cibuildwheel
        run: python -m pip install --upgrade "cibuildwheel==3.3.1"

      - name: Build NumPy Android wheel
        shell: bash
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
          # Android ARM64 build has no packaged BLAS yet. Use NumPy's supported
          # internal fallback and LP64 ABI; avoid probing unavailable ILP64 BLAS.
          CIBW_CONFIG_SETTINGS: "setup-args=-Duse-ilp64=false setup-args=-Dallow-noblas=true build-dir=build"
          CIBW_BEFORE_BUILD: "pip install 'Cython>=3.0.6' 'meson-python>=0.15.0'"
          CIBW_TEST_COMMAND: " "
        run: |
          set -euo pipefail
          python -m cibuildwheel --output-dir wheelhouse "src/numpy-$NUMPY_VERSION"

      - name: Build Rasterio Android wheel
        shell: bash
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
        run: |
          set -euo pipefail
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          export CIBW_ENVIRONMENT="GDAL_PREFIX=$GDAL_PREFIX GDAL_CONFIG=$GITHUB_WORKSPACE/gdal-config PKG_CONFIG_PATH=$GDAL_PREFIX/lib/pkgconfig"
          export CIBW_BEFORE_BUILD="pip install cython numpy==$NUMPY_VERSION setuptools wheel"
          python -m cibuildwheel --output-dir wheelhouse "src/rasterio-$RASTERIO_VERSION"

      - name: Collect GDAL runtime libraries and data
        shell: bash
        run: |
          set -euo pipefail
          GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          mkdir -p wheelhouse/native wheelhouse/data
          find "$GDAL_PREFIX/lib" -maxdepth 1 -type f -name '*.so*' -exec cp -av {} wheelhouse/native/ \;
          test -n "$(find wheelhouse/native -type f -name '*.so*' -print -quit)"
          cp -a "$GDAL_PREFIX/share/gdal" wheelhouse/data/gdal
          cp -a "$GDAL_PREFIX/share/proj" wheelhouse/data/proj

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-gis-wheels
          path: wheelhouse
          if-no-files-found: error
          retention-days: 14
