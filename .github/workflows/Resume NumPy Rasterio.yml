name: Resume NumPy + Rasterio Android wheels (reuse GDAL)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/Resume NumPy Rasterio.yml"

env:
  PY_TAG: cp313
  GDAL_TRIPLET: arm64-android-gis
  RASTERIO_VERSION: "1.4.3"
  NUMPY_VERSION: "1.26.2"
  GDAL_SOURCE_RUN_ID: "45036542523"

jobs:
  wheels:
    name: Build NumPy + Rasterio Android wheels (resume after source download)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Reuse the verified artifacts created in Run #22; do not rebuild GDAL
      # and do not download NumPy/Rasterio source distributions again.
      - uses: actions/download-artifact@v4
        with:
          name: gdal-prefix
          run-id: 45042047911
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          name: python-sdists
          run-id: 45042047911
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Restore and validate cached inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/gdal" src
          tar -xzf gdal-prefix.tgz -C "$HOME/gdal"
          test -f "$HOME/gdal/$GDAL_TRIPLET/include/gdal.h"
          test -f "$HOME/gdal/$GDAL_TRIPLET/lib/libgdal.so"
          test -s "rasterio-$RASTERIO_VERSION.tar.gz"
          tar -xzf "rasterio-$RASTERIO_VERSION.tar.gz" -C src
          test -d "src/rasterio-$RASTERIO_VERSION"
          echo "Restored GDAL prefix and both source archives; no source downloads."

      - name: Install cibuildwheel
        run: python -m pip install --upgrade "cibuildwheel==3.3.1"

      # cibuildwheel downloads this pinned Android CPython runtime from
      # Maven Central. Pre-populate its documented cache path with retries so
      # transient Maven HTTP 429 responses do not abort the build.
      - name: Cache Android CPython 3.13 runtime
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="$HOME/.cache/cibuildwheel"
          RUNTIME="$CACHE_DIR/python-3.13.11-aarch64-linux-android.tar.gz"
          URL="https://repo.maven.apache.org/maven2/com/chaquo/python/python/3.13.11/python-3.13.11-aarch64-linux-android.tar.gz"
          mkdir -p "$CACHE_DIR"
          if [ ! -s "$RUNTIME" ] || ! tar -tzf "$RUNTIME" >/dev/null 2>&1; then
            rm -f "$RUNTIME"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 900 "$URL" -o "$RUNTIME"
          fi
          tar -tzf "$RUNTIME" >/dev/null
          echo "Verified cached Android CPython runtime: $RUNTIME"
          ls -lh "$RUNTIME"

      - name: Download and verify prebuilt Chaquopy NumPy wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse "src/rasterio-$RASTERIO_VERSION/.build-wheels"
          BASE="https://chaquo.com/pypi-13.1"
          files=(
            "numpy/numpy-1.26.2-0-cp313-cp313-android_24_arm64_v8a.whl"
            "chaquopy-openblas/chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl"
            "chaquopy-libcxx/chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl"
            "chaquopy-libgfortran/chaquopy_libgfortran-4.9-0-py3-none-android_21_arm64_v8a.whl"
          )
          for file in "${files[@]}"; do
            name="${file##*/}"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
              "$BASE/$file" -o "wheelhouse/$name"
            python -m zipfile -t "wheelhouse/$name"
            cp "wheelhouse/$name" "src/rasterio-$RASTERIO_VERSION/.build-wheels/"
          done
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          expected = {
              "numpy-1.26.2-0-cp313-cp313-android_24_arm64_v8a.whl",
              "chaquopy_openblas-0.2.20-5-py3-none-android_21_arm64_v8a.whl",
              "chaquopy_libcxx-180000-0-py3-none-android_24_arm64_v8a.whl",
              "chaquopy_libgfortran-4.9-0-py3-none-android_21_arm64_v8a.whl",
          }
          found = {p.name for p in Path("wheelhouse").glob("*.whl")}
          if found != expected:
              raise SystemExit(f"Unexpected prebuilt wheel set: {found}")
          numpy = next(Path("wheelhouse").glob("numpy-*.whl"))
          with ZipFile(numpy) as z:
              metadata_name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = z.read(metadata_name).decode()
          print("Prebuilt NumPy metadata:")
          print("\n".join(line for line in metadata.splitlines() if line.startswith(("Name:", "Version:", "Requires-Dist:"))))
          assert "Name: numpy" in metadata and "Version: 1.26.2" in metadata
          PY
          echo "Prebuilt CPython 3.13 Android ARM64 NumPy and runtime dependency wheels validated."

      - name: Build Rasterio Android wheel
        shell: bash
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_arm64_v8a
          CIBW_ARCHS: arm64_v8a
        run: |
          set -euo pipefail
          export GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          export CIBW_ENVIRONMENT="GDAL_PREFIX=$GDAL_PREFIX GDAL_CONFIG=$GITHUB_WORKSPACE/gdal-config PKG_CONFIG_PATH=$GDAL_PREFIX/lib/pkgconfig"
          export CIBW_BEFORE_BUILD="pip install --no-index --find-links={project}/.build-wheels cython numpy==$NUMPY_VERSION setuptools wheel"
          python -m cibuildwheel --output-dir wheelhouse "src/rasterio-$RASTERIO_VERSION"

      - name: Collect GDAL runtime libraries and data
        shell: bash
        run: |
          set -euo pipefail
          GDAL_PREFIX="$HOME/gdal/$GDAL_TRIPLET"
          mkdir -p wheelhouse/native wheelhouse/data
          find "$GDAL_PREFIX/lib" -maxdepth 1 -type f -name '*.so*' -exec cp -av {} wheelhouse/native/ \;
          test -n "$(find wheelhouse/native -type f -name '*.so*' -print -quit)"
          cp -a "$GDAL_PREFIX/share/gdal" wheelhouse/data/gdal
          cp -a "$GDAL_PREFIX/share/proj" wheelhouse/data/proj

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-gis-wheels
          path: wheelhouse
          if-no-files-found: error
          retention-days: 14
